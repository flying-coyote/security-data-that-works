# Liger Stack Configuration Spec
version: 1.0.0
components:
  storage:
    provider: seaweedfs
    bucket_name: liger-warehouse
    port: 8333
    volume_size_gb: 10
  catalog:
    provider: polaris
    port: 8181
    admin_client_id: admin
    admin_client_secret: adminsecret
  pipeline:
    provider: vector
    observe_port: 8686
    ingest_port: 514
    vrl_transform: |
      # 1. Parse incoming syslog message as JSON
      parsed = parse_json!(.message)
      
      # 2. Map fields to OCSF Authentication schema (class 3002)
      .class_uid = 3002
      .category_uid = 3
      .activity_id = 1 # logon
      .event_time = parsed.timestamp
      
      # 3. Actor/user mappings
      .actor = {
        "user": {
          "name": parsed.user
        }
      }
      
      # 4. Status mapping
      .status_id = if parsed.success { 1 } else { 2 } # 1 = Success, 2 = Failure
      
      # 5. Clean up raw data
      del(.message)

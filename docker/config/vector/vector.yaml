# R tier — normalize raw telemetry to OCSF with Vector/VRL (Tenzir is the security-native swap).
# Raw Okta-style auth log -> OCSF Authentication (class_uid 3002). The S3->Iceberg promotion (bronze parquet
# -> ocsf.authentication via the lab/pyiceberg) is the next hop; this proves the normalization stage.
data_dir: /vd
sources:
  raw:
    type: file
    include: ["/etc/vector/sample.ndjson"]
    read_from: beginning
  # Vector has no control/REST API for throughput, so the honest source of real
  # per-component counters is its own internal_metrics, exported for Prometheus scrape.
  internal_metrics:
    type: internal_metrics
transforms:
  ocsf:
    type: remap
    inputs: [raw]
    source: |
      e = parse_json!(.message)
      . = {}
      .class_uid = 3002
      .class_name = "Authentication"
      .category_uid = 3
      .time = to_unix_timestamp(parse_timestamp!(e.published, "%+"), unit: "milliseconds")
      # Canonical (CON-AUTH-1): activity_id = the operation (1 Logon, from the event type); the
      # success/failure outcome lives in status_id (1 Success / 2 Failure), NOT in activity_id.
      .activity_id = 1
      .status_id = if e.outcome.result == "SUCCESS" { 1 } else { 2 }
      .user = e.actor.alternateId
      .src_ip = e.client.ipAddress
      .status = e.outcome.result
sinks:
  console:
    type: console
    inputs: [ocsf]
    encoding: {codec: json}
  # Real throughput counters: component_{received,sent}_events_total + component_errors_total,
  # tagged by component_id, served at :9598/metrics. The console scrapes this; when the scrape
  # fails the panel shows "—" (unmeasured), never a fabricated count.
  metrics:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: "0.0.0.0:9598"
tests:
  - name: okta_auth_to_ocsf
    inputs:
      - insert_at: ocsf
        type: log
        log_fields:
          message: '{"published":"2026-01-01T00:00:01Z","eventType":"user.session.start","outcome":{"result":"SUCCESS"},"actor":{"alternateId":"jdoe@acme.example"},"client":{"ipAddress":"10.10.1.21"}}'
    outputs:
      - extract_from: ocsf
        conditions:
          - type: vrl
            source: |
              assert_eq!(.class_uid, 3002)
              assert_eq!(.category_uid, 3)
              assert_eq!(.activity_id, 1)
              assert_eq!(.status_id, 1)
              assert_eq!(.user, "jdoe@acme.example")
              assert_eq!(.src_ip, "10.10.1.21")

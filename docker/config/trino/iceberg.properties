connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
# Templated so a store swap (MinIO->SeaweedFS) flows through to Trino too (Trino ${ENV:..} substitution);
# the trino service passes S3_INTERNAL_ENDPOINT (defaulting to minio) — see compose.yml.
s3.endpoint=${ENV:S3_INTERNAL_ENDPOINT}
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=moar
s3.aws-secret-key=moar-dev-secret

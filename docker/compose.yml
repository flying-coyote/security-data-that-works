# MOAR reference stack — composable, tiered, run-only-what-you-need.
#
# The deployment tiers ARE the book's L-I-G-E-R component model made independently deployable, plus two
# extensions this kit adds (an agentic/air-gap tier and a Sigma/marimo detection cross-cut), plus an opt-in
# Traditional-SIEM "foil" tier for head-to-head benchmarks. Pick tiers with --profile; size with scale/.
#
#   L akehouse  — object store + table format          (minio; swap: seaweedfs)     [core]
#   I ndex      — metadata catalog / governance        (iceberg-rest; swap: nessie, lakekeeper; ducklake = format swap)
#   E ngine     — query engines matched to workloads   (duckdb in core; add: trino, clickhouse, starrocks; dremio opt-in)
#   R oute      — pipelines + OCSF normalization        (vector; swap: tenzir, fluent-bit)   [route]
#   G raph      — visualization / query interface       (grafana)                    [graph]
#   + Agentic   — practitioner-owned local AI            (ollama + mcp)               [ai]
#   + Detection — detection-as-code                      (marimo + sigma)             [detection]
#   Foil        — Traditional-SIEM baselines (opt-in)    (graylog/opensearch/…)       [baselines]
#
# Always include --profile core (the L+I+embedded-E foundation everything else reads).
#   docker compose --profile core up -d
#   docker compose --profile core --profile engine-trino --profile detection up -d
# Or use the scale presets:  ./moar up workstation
#
# Resource budgets, scale presets, and the air-gap/license matrix are in README.md.

name: moar

networks:
  moar:
    driver: bridge

volumes:
  minio_data:
  seaweedfs_data:
  route_data:

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_USER:-moar}
  AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-moar-dev-secret}
  AWS_REGION: us-east-1

services:
  # ---- L: object store (the lakehouse storage layer) -------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: ["store-minio"]
    networks: [moar]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-moar}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-moar-dev-secret}
    ports: ["9100:9000", "9101:9001"]   # 91xx range: MOAR coexists with the legacy benchmark stack on 90xx
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # one-shot: create the warehouse bucket with a bronze/silver/gold medallion layout (peer convention)
  minio-init:
    image: minio/mc:latest
    profiles: ["store-minio"]
    networks: [moar]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set h http://minio:9000 ${MINIO_USER:-moar} ${MINIO_PASSWORD:-moar-dev-secret} &&
      mc mb -p h/warehouse/bronze h/warehouse/silver h/warehouse/gold &&
      echo 'warehouse bucket ready (bronze/silver/gold)'"

  # ---- L (swap): SeaweedFS object store — lighter (~100-300MB vs MinIO ~256-512MB), q3-validated S3 quirks.
  # Swap reason: smaller footprint for the laptop tier; proves the lakehouse is indifferent to the object
  # backend (run `./moar verify` after a swap — same Iceberg data, identical answers). Bind to container IP.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["store-seaweedfs"]
    networks: [moar]
    command: "server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer -dir=/data"
    ports: ["8333:8333"]
    volumes:
      - seaweedfs_data:/data
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ 2>&1 | grep -q . || true; exit 0"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-init:
    image: minio/mc:latest
    profiles: ["store-seaweedfs"]
    networks: [moar]
    depends_on:
      seaweedfs: {condition: service_started}
    # SeaweedFS rejects MinIO's policy resource format — create the bucket prefixes only, no policy set.
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set h http://seaweedfs:8333 ${MINIO_USER:-moar} ${MINIO_PASSWORD:-moar-dev-secret} &&
      mc mb -p h/warehouse/bronze h/warehouse/silver h/warehouse/gold &&
      echo 'seaweedfs warehouse bucket ready (bronze/silver/gold)'"

  # ---- I: metadata catalog (Iceberg REST — the low-risk default; nessie/polaris/ducklake are swaps) ---
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    profiles: ["core"]
    networks: [moar]
    # No store-specific depends_on (the object store is a swappable profile); S3 is contacted lazily at
    # table-create, by when the chosen store + its bucket-init are up. S3_INTERNAL_ENDPOINT selects the store.
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- I (swap): Nessie — Iceberg REST catalog with git-style branching, in-memory version store (no extra
  # DB needed for the demo). Swap reason: catalog portability — the lab + engines speak the same Iceberg REST
  # contract, so pointing a client at Nessie must yield the IDENTICAL answer as iceberg-rest (./moar verify).
  # The client does the S3 I/O with its own creds; Nessie holds the commit + the warehouse base location.
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    profiles: ["index-nessie"]
    networks: [moar]
    environment:
      nessie.version.store.type: IN_MEMORY
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      # Nessie's catalog service validates the warehouse location, so it needs the S3 creds (STATIC auth).
      # Secrets are referenced indirectly via a urn pointing at the .name/.secret pair (Nessie convention).
      nessie.catalog.service.s3.default-options.auth-mode: STATIC
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${MINIO_USER:-moar}
      nessie.catalog.secrets.access-key.secret: ${MINIO_PASSWORD:-moar-dev-secret}
    ports: ["19121:19120"]   # 19120 is the legacy benchmark stack's Nessie; MOAR Nessie host-maps to 19121

  # ---- I (swap): Lakekeeper — the Iceberg REST catalog spec implemented in Rust (no JVM), Postgres-backed.
  # Swap reason: a THIRD independent catalog codebase. iceberg-rest (Java fixture) and Nessie (Java/Quarkus)
  # already prove the spec is portable; Lakekeeper is a different language and team implementing the same REST
  # contract, so an identical answer across all three is a strong portability signal (`./moar swap-catalog`).
  # Static MinIO creds, STS off (the client uses its own keys), s3-compat flavor, path-style. Client connects
  # at uri=http://lakekeeper:8181/catalog with warehouse="warehouse". Needs migrate -> serve -> bootstrap ->
  # create-warehouse, wired as ordered one-shots below.
  lakekeeper-db:
    image: postgres:17
    profiles: ["index-lakekeeper"]
    networks: [moar]
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.12.3
    profiles: ["index-lakekeeper"]
    networks: [moar]
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: CHANGE_ME_local_dev_only
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      RUST_LOG: info
    depends_on:
      lakekeeper-db: {condition: service_healthy}

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.12.3
    profiles: ["index-lakekeeper"]
    networks: [moar]
    command: ["serve"]
    environment: *lakekeeper-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      lakekeeper-db: {condition: service_healthy}
      lakekeeper-migrate: {condition: service_completed_successfully}
    ports: ["8182:8181"]   # host 8182 -> container 8181 (8181 host is taken by iceberg-rest)

  # one-shot: accept terms (bootstrap) then create the "warehouse" pointing at the SAME MinIO bucket. Targets
  # the CONTAINER port 8181 (in-network), not the host 8182 mapping. Idempotent enough for a demo (re-bootstrap
  # is a no-op error that's tolerated; warehouse create is skipped if it already exists).
  lakekeeper-init:
    image: curlimages/curl:8.11.0
    profiles: ["index-lakekeeper"]
    networks: [moar]
    restart: "no"
    depends_on:
      lakekeeper: {condition: service_healthy}
    volumes: ["./lakekeeper-warehouse.json:/work/warehouse.json:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -sS -X POST http://lakekeeper:8181/management/v1/bootstrap
        -H 'Content-Type: application/json' --data '{"accept-terms-of-use": true}' || true;
        curl -sS -X POST http://lakekeeper:8181/management/v1/warehouse
        -H 'Content-Type: application/json' --data @/work/warehouse.json;
        echo ' lakekeeper warehouse init done'

  # ---- E (embedded): DuckDB lab — the reference engine + the write/read tool over the lakehouse --------
  # Write path here is pyiceberg/DuckDB (cf. SoloLakehouse ADR-17 write/read split); distributed read
  # engines come from the engine-* profiles. Self-contained so `core` alone is a queryable lakehouse.
  lab:
    build: ./lab
    image: moar/lab:latest
    profiles: ["core"]
    networks: [moar]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      <<: *s3-env
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes: ["./lab:/lab"]
    command: ["sleep", "infinity"]

  # ---- E (distributed): query engines over the SAME lakehouse. Pick per workload; one sub-profile each.
  # The answer-equivalence differentiator: a distributed engine reads the exact Iceberg table the lab wrote,
  # and a cross-engine check (lab smoke_verify) asserts identical answers — verify-the-answer, not trust it.
  trino:
    image: trinodb/trino:481
    profiles: ["engine-trino"]
    networks: [moar]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}   # store-swap flows to Trino's catalog
    ports: ["8081:8080"]   # 8080 is the legacy stack's Trino; MOAR Trino on 8081
    volumes: ["./config/trino/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro"]
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 24

  # ---- E (real-time OLAP): ClickHouse over the SAME Iceberg table (the flagship silent-wrong-answer engine).
  # Reads via the icebergS3 table function (snapshot-correct: it resolves the table's current metadata from S3,
  # so no orphan-data-file risk and no REST-catalog dependency). `./moar verify` cross-checks its count against
  # DuckDB + Trino — the answer-equivalence gate now spans three independent reader codebases.
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    profiles: ["engine-clickhouse"]
    networks: [moar]
    environment:
      <<: *s3-env
    ports: ["8125:8123"]   # HTTP UI on 8125 (8123/8124 taken by other local stacks); native port internal-only
    # make the default user reachable over the network (the image ships an empty <networks> allowlist) so
    # in-stack clients — e.g. the lab container's ./moar bench — can query it over HTTP, not just clickhouse-local.
    volumes: ["./config/clickhouse/users-allow.xml:/etc/clickhouse-server/users.d/zz-moar-allow.xml:ro"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 24

  # ---- E (MPP OLAP): StarRocks over the SAME Iceberg table via an external REST catalog. The FOURTH reader
  # codebase in the answer-equality gate (DuckDB embedded, Trino MPP-JVM, ClickHouse C++, StarRocks C++/MPP).
  # All-in-one image (FE+BE in one container). The catalog is created at verify time via SQL (StarRocks has no
  # boot-time properties file like Trino) — see `./moar verify`. count_if is native; root has no password.
  starrocks:
    image: starrocks/allin1-ubuntu:4.1-latest
    profiles: ["engine-starrocks"]
    networks: [moar]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    ports:
      - "9031:9030"   # FE MySQL query protocol (host 9031; legacy StarRocks holds 9030)
      - "8031:8030"   # FE HTTP
    mem_limit: 8g     # 4g is the documented floor; 8g gives an Iceberg scan headroom
    healthcheck:
      # gate on BE registration, not just FE up: SELECT 1 passes before a BE can serve an Iceberg scan
      test: ["CMD-SHELL", "mysql -P 9030 -h 127.0.0.1 -u root -N -B -e 'SHOW BACKENDS' 2>/dev/null | grep -q true || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # ---- E (federation): Dremio OSS — the fifth engine, VERIFIED via a Nessie source. OSS lacks the Iceberg REST
  # catalog source (Enterprise only), so Dremio reads the Nessie-written copy of the table — the same logical
  # OCSF data the iceberg-rest gate reads, independently committed through a second catalog. Setup is an
  # idempotent REST choreography (config/dremio/setup-dremio.sh: bootstrap -> login -> source -> query), since
  # Dremio has no boot-time catalog file. Confirmed 1000/125, identical to the other four engines. `./moar
  # verify` folds it in when it's running; `./moar verify-dremio` runs it standalone. Bring up with
  # --profile core --profile index-nessie --profile engine-dremio.
  dremio:
    image: dremio/dremio-oss:26.0
    profiles: ["engine-dremio"]
    networks: [moar]
    environment:
      DREMIO_MAX_MEMORY_SIZE_MB: "4096"
    ports:
      - "9147:9047"     # UI + REST (host 9147; legacy Dremio holds 9047)
      - "31110:31010"   # JDBC/ODBC
      - "32110:32010"   # Arrow Flight
    mem_limit: 6g

  # ---- Detection (cross-cut): detection-as-code over the lakehouse — SigmaHQ -> SQL + marimo hunting ---
  detection:
    build: ./detection
    image: moar/detection:latest
    profiles: ["detection"]
    networks: [moar]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      <<: *s3-env
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes: ["./detection:/detection"]
    ports: ["2718:2718"]   # marimo edit/app UI when run interactively
    command: ["sleep", "infinity"]

  # ---- AI (extension): practitioner-owned, air-gappable agentic hunt — LOCAL model, code-action over the lake
  ai:
    build: ./ai
    image: moar/ai:latest
    profiles: ["ai"]
    networks: [moar]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach the host's local Ollama; no cloud
    environment:
      <<: *s3-env
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      # agent.py auto-resolves the reachable Ollama endpoint; these just feed candidates. OLLAMA_HOST_IP is the
      # WSL host IP injected by `./moar` (needed under Docker Desktop when Ollama runs in a separate WSL distro,
      # where host.docker.internal can't route to it). Override OLLAMA_URL to pin an endpoint explicitly.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_HOST_IP: ${OLLAMA_HOST_IP:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    volumes: ["./ai:/ai"]
    command: ["sleep", "infinity"]

  # ---- R: route/ingest — normalize raw telemetry to OCSF (Vector/VRL; Tenzir is the security-native swap)
  route:
    image: timberio/vector:latest-alpine
    profiles: ["route"]
    networks: [moar]
    volumes:
      - ./config/vector:/etc/vector:ro
      - route_data:/vd
    command: ["--config", "/etc/vector/vector.yaml"]

  # ---- R (swap): Tenzir — security-native pipeline (Sigma/OCSF/STIX-aware). Same raw Okta event, same OCSF
  # Authentication output as the Vector transform, which is the point of the swap: the route tier is
  # replaceable as long as the OCSF contract on the other side is identical. Reads the SAME sample so the two
  # are byte-comparable (run `./moar swap-router`). One-shot pipeline; exits after emitting the OCSF rows.
  route-tenzir:
    image: tenzir/tenzir:latest
    profiles: ["route-tenzir"]
    networks: [moar]
    volumes:
      - ./config/tenzir/okta-ocsf.tql:/etc/tenzir/okta-ocsf.tql:ro
      - ./config/vector/sample.ndjson:/etc/tenzir/sample.ndjson:ro
    command: ["-f", "/etc/tenzir/okta-ocsf.tql"]

  # ---- R (swap): Fluent Bit — CNCF, C, lightweight log processor. The third router: the SAME raw Okta event
  # to the SAME OCSF Authentication output as Vector and Tenzir, proving the route tier is replaceable across
  # three independent codebases (Rust/Vector, C++/Tenzir, C/Fluent Bit). One-shot: tail reads the file from the
  # head and exits on EOF, printing the OCSF rows to stdout (run `./moar swap-router`). OCSF mapping is in a Lua
  # filter (config/fluentbit/ocsf.lua); TZ=UTC so the epoch-ms conversion has no hidden timezone dependence.
  route-fluentbit:
    image: fluent/fluent-bit:5.0.7
    profiles: ["route-fluentbit"]
    networks: [moar]
    environment:
      TZ: UTC
    volumes:
      - ./config/fluentbit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./config/fluentbit/ocsf.lua:/fluent-bit/etc/ocsf.lua:ro
      - ./config/vector/sample.ndjson:/data/sample.ndjson:ro
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]

  # ---- G: graph/visualization + observability of the stack (and a home for benchmark dashboards) --------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["graph"]
    networks: [moar]
    volumes: ["./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9190:9090"]   # 90xx is the legacy stack; MOAR observability on 91xx
  grafana:
    image: grafana/grafana:latest
    profiles: ["graph"]
    networks: [moar]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${MINIO_PASSWORD:-moar-dev-secret}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes: ["./config/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
  loki:
    image: grafana/loki:3.3.0
    profiles: ["graph"]
    networks: [moar]
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes: ["./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro"]
    ports: ["3101:3100"]
  pushgateway:
    image: prom/pushgateway:latest
    profiles: ["graph"]
    networks: [moar]
    ports: ["9191:9091"]

  # ---- Foil (opt-in): the schema-on-read SIEM you benchmark AGAINST, in the same compose (fair-broker).
  # OpenSearch is the open representative; Graylog is the other open option; a licensed schema-on-read SIEM
  # (e.g. Splunk) is reference-only (EULA — don't ship the image). Heaviest tier; run one SIEM at a time.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: ["baselines"]
    networks: [moar]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: {soft: -1, hard: -1}
    mem_limit: 4g
    ports: ["9211:9200"]   # 90xx/9201 taken by the legacy stack; MOAR foil on 9211
